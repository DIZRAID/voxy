# Build release bundles and publish them as a GitHub release.
#
# Trigger: push a tag named v<version>, where <version> is "version" in
# src-tauri/tauri.conf.json (e.g. v0.1.0). The tagged commit must be on main.
# There is no manual trigger: a release is always built from a v* tag.
#
# Jobs:
#   check-version   the tag matches tauri.conf.json, the tagged commit is on
#                   main, and that version is not published yet
#   create-release  deletes drafts that earlier runs left for this version and
#                   creates one new draft (its id goes to publish)
#   build           macOS (Apple Silicon) and Windows (x64) bundles, uploaded
#                   as workflow artifacts. Read-only token: this job runs the
#                   whole third-party build graph (crates' build scripts and
#                   proc macros, the Tauri CLI), so it gets no write access
#                   and no token in its environment.
#   publish         checks the macOS app that install.sh will download,
#                   attests the files (Sigstore build provenance), uploads
#                   them into the draft, compares each upload's SHA-256 with
#                   the checked file and publishes the draft (marked Latest).
#                   It runs no repository or third-party build code.
#
# install.sh at the repository root downloads the .app.tar.gz from
# https://api.github.com/repos/<owner>/<repo>/releases/latest, so a release
# without a working macOS app must never become Latest. Once published, the
# release is Latest right away and every install command picks it up. A
# failed Windows build doesn't block publishing (the Windows port is
# experimental).
#
# Output (for version 0.1.0):
#   macOS (Apple Silicon): Voxy_0.1.0_aarch64.app.tar.gz  (used by install.sh)
#                          Voxy_0.1.0_aarch64.dmg
#   Windows (x64):         Voxy_0.1.0_x64-setup.exe       (NSIS installer)
#
# Supply chain: third-party actions are pinned to full commit SHAs (Dependabot
# bumps them), the Tauri CLI and the Rust toolchain to exact versions, and the
# sherpa-onnx static libraries linked into the app to the SHA-256 values in
# src-tauri/sherpa-onnx.sha256. When the tauri crate in Cargo.lock moves to a
# new minor version, bump TAURI_CLI_VERSION below with it.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release run at a time: create-release deletes the drafts of its
# version, which would break another run that is still uploading into one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # npm package @tauri-apps/cli; npm never lets a published version change.
  TAURI_CLI_VERSION: "2.11.5"
  # rustc that builds the release (v0.1.0 was built with 1.98.1).
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  # Cheap check on Linux before the expensive macOS/Windows builds start.
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history and all branches, for the "is it on main" check
          fetch-depth: 0
          persist-credentials: false

      - name: Compare tag with app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(awk -F'"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)
          echo "tauri.conf.json: $conf, Cargo.toml: $crate, ref: $GITHUB_REF_TYPE $GITHUB_REF_NAME, commit: $GITHUB_SHA"
          if ! [[ "$conf" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version in src-tauri/tauri.conf.json ($conf) is not MAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ "$crate" != "$conf" ]; then
            echo "::warning::Cargo.toml version ($crate) differs from tauri.conf.json ($conf); bundles use $conf"
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Releases are built only from a v* tag."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$conf" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $conf in src-tauri/tauri.conf.json (expected v$conf)"
            exit 1
          fi
          # A tag on an unmerged branch must not become the release every
          # install command downloads.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Merge first, then tag a commit on main."
            exit 1
          fi
          # Stop before the builds if this version is already out.
          if is_draft=$(gh release view "v$conf" --json isDraft --jq .isDraft 2>/dev/null) && [ "$is_draft" = "false" ]; then
            echo "::error::Release v$conf is already published. Bump the version in src-tauri/tauri.conf.json first."
            exit 1
          fi
          echo "version=$conf" >>"$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # Drafts of this version from earlier runs (a failed build, a re-run
          # of the whole workflow) would mix old assets into the release.
          # ("Re-run failed jobs" keeps this job's result and uploads into the
          # same draft; publish replaces assets with the same name.)
          old=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id")
          for id in $old; do
            echo "Deleting the old draft $id of $tag"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done

          notes="$RUNNER_TEMP/notes.md"
          cat >"$notes" <<'EOF'
          ## macOS 14 or later, Apple Silicon

          Install or update with one command in Terminal:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/DIZRAID/voxy/main/install.sh | bash
          ```

          It puts Voxy in /Applications and starts it. Run the same command to update.

          Or download the `.dmg` below and drag Voxy to Applications. Voxy is not notarized by Apple, so macOS blocks it the first time you open it. On macOS 14, Control-click (right-click) Voxy, choose Open, then confirm. On macOS 15 and later, close the warning, then open System Settings → Privacy & Security, scroll down and click **Open Anyway**.

          Voxy asks for Microphone, Accessibility and Input Monitoring. The app is not signed with an Apple Developer ID yet, so after each update it needs Accessibility and Input Monitoring again: the install command clears the old entries, and macOS asks when Voxy starts. After updating from the `.dmg`, clear them with this command, then allow both again:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/DIZRAID/voxy/main/install.sh | bash -s -- --reset-permissions
          ```

          If you saved an API key for an online provider, macOS may ask for your login password the first time Voxy reads it after an update: click Always Allow.

          ## Windows 10/11, x64 (experimental)

          The `-setup.exe` installer, when the Windows build succeeded. The Windows port has not been tested yet. SmartScreen may warn about an unknown publisher: click More info → Run anyway.

          ## Verifying a download

          Every file here was built by this repository's release workflow, which signed a build provenance attestation for it. With the GitHub CLI: `gh attestation verify <file> -R DIZRAID/voxy --signer-workflow DIZRAID/voxy/.github/workflows/release.yml`. See SECURITY.md.
          EOF

          id=$(jq -n --arg tag "$tag" --arg name "Voxy $tag" --arg sha "$GITHUB_SHA" --rawfile body "$notes" \
            '{tag_name: $tag, name: $name, body: $body, target_commitish: $sha, draft: true, prerelease: false}' |
            gh api -X POST "repos/$GH_REPO/releases" --input - --jq .id)
          echo "Created the draft release $id for $tag"
          echo "id=$id" >>"$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # Read-only: see the header. The bundles leave this job only as workflow
    # artifacts; publish uploads them into the release.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            # bundle.targets in tauri.conf.json has no "dmg", so ask for it here.
            bundles: app,dmg
            # archive_name() in sherpa-onnx-sys's build.rs
            sherpa_archive: osx-arm64-static-lib
            artifact: bundle-macos
            timeout: 60
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            sherpa_archive: win-x64-static-MT-Release-lib
            artifact: bundle-windows
            timeout: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-25
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # The sherpa-onnx build script would download these libraries itself,
      # without checking any hash. The script checks the pinned SHA-256 and
      # sets SHERPA_ONNX_LIB_DIR, so the build script downloads nothing.
      - name: Fetch and verify sherpa-onnx static libraries
        shell: bash
        env:
          SHERPA_ARCHIVE: ${{ matrix.sherpa_archive }}
        run: bash .github/scripts/fetch-sherpa-onnx.sh "$SHERPA_ARCHIVE"

      # Exact version, no install scripts (the package has none). The CLI
      # drives cargo, bundling, the .dmg and code signing.
      - name: Install the Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "@tauri-apps/cli@$TAURI_CLI_VERSION"
          cli="$(npm root --global)/@tauri-apps/cli/tauri.js"
          got=$(node "$cli" --version)
          echo "$got"
          if [ "$got" != "tauri-cli $TAURI_CLI_VERSION" ]; then
            echo "::error::Expected tauri-cli $TAURI_CLI_VERSION, got: $got"
            exit 1
          fi
          echo "TAURI_CLI=$cli" >>"$GITHUB_ENV"

      # Ad-hoc code signature ("-": no certificate, no Apple account). Tauri then
      # runs `codesign --force -s - --options runtime --entitlements
      # Entitlements.plist` on the executable and on Voxy.app, so the bundle is
      # sealed. Without it a .dmg downloaded in a browser opens as "damaged";
      # with it Gatekeeper offers "Open Anyway". Notarization is skipped
      # (no APPLE_ID / APPLE_API_KEY), and Tauri never signs the .dmg itself
      # with "-". An ad-hoc signature is new on every build, so macOS forgets
      # the Accessibility and Input Monitoring permissions on each update
      # (install.sh resets them). Set only for macOS: an empty value would make
      # codesign fail. The publish job checks the result.
      - name: Use an ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      # No Rust cache here on purpose: releases are rare and are built from
      # scratch.
      - name: Build
        shell: bash
        working-directory: src-tauri
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          # Windows: link the VC++ runtime statically, so the app starts on PCs
          # without the VC++ Redistributable (the installer doesn't ship it).
          # The locked tauri-build (2.6.3) only reads this variable. Tauri CLI
          # 2.11 sets it by itself, but the next minor CLI release stops doing
          # that in favour of the build.windows.staticVCRuntime config key,
          # which tauri-build 2.6.3 doesn't read. macOS builds ignore it.
          STATIC_VCRUNTIME: "true"
          # What tauri-action v1 set for the .dmg (lay out the window with
          # Finder even on CI).
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

          # Developer ID signing and notarization are not set up. To switch to
          # them (macOS job only), keep the certificate in a protected GitHub
          # Environment (required reviewer, v* tags only), add these, and
          # remove the ad-hoc step above:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                 # base64 of the Developer ID .p12
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}       # "Developer ID Application: Name (TEAMID)"
          # Notarization with an Apple ID and an app-specific password:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ...or with an App Store Connect API key instead:
          # APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}                         # key ID
          # APPLE_API_KEY_PATH: path to AuthKey_<key ID>.p8, written by an earlier step
          #
          # Any signing turns on the hardened runtime (bundle.macOS.hardenedRuntime
          # defaults to true). Under it the microphone needs the
          # com.apple.security.device.audio-input entitlement: it is in
          # src-tauri/Entitlements.plist (bundle.macOS.entitlements).
          #
          # Windows signing is configured in tauri.conf.json
          # (bundle.windows.certificateThumbprint or bundle.windows.signCommand),
          # not through environment variables.
        run: |
          set -euo pipefail
          # One retry, as tauri-action did: .dmg creation (hdiutil) is flaky
          # on CI runners, and the compiled code is reused.
          if ! node "$TAURI_CLI" build --target "$TARGET" --bundles "$BUNDLES"; then
            echo "::warning::tauri build failed; retrying once"
            sleep 10
            node "$TAURI_CLI" build --target "$TARGET" --bundles "$BUNDLES"
          fi

      - name: Collect the bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          mkdir dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Voxy.app at the root of the archive, packed like tauri-action v1
            # did; install.sh and the publish job expect exactly that.
            tar -czf "dist/Voxy_${VERSION}_aarch64.app.tar.gz" -C "$bundle/macos" Voxy.app
            cp "$bundle/dmg/Voxy_${VERSION}_aarch64.dmg" dist/
          else
            cp "$bundle/nsis/Voxy_${VERSION}_x64-setup.exe" dist/
          fi
          cd dist
          ls -l
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -- *; else shasum -a 256 -- *; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          # .tar.gz, .dmg and .exe are compressed already
          compression-level: 0

  publish:
    name: Publish
    needs: [check-version, create-release, build]
    # Also after a failed Windows build: the macOS app is what counts, and the
    # steps below require it.
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    # macOS for codesign, to check the app the way install.sh gets it.
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload into the draft and publish it
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.create-release.outputs.id }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      # Each artifact into its own directory, by exact name: a Windows
      # artifact can't replace a macOS file of the same name.
      - name: Download the macOS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-macos
          path: artifacts/macos

      - name: Download the Windows bundle
        id: windows
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-windows
          path: artifacts/windows

      # Check the archive install.sh downloads: Voxy.app at its root, a valid
      # sealed signature, the hardened runtime and the microphone entitlement
      # (without it Voxy would record silence). A Tauri CLI that signed
      # differently would stop here, before anyone installs it. The upload
      # step then proves (SHA-256) that the release gets these exact bytes.
      - name: Check the macOS app
        env:
          WINDOWS_OUTCOME: ${{ steps.windows.outcome }}
        run: |
          set -euo pipefail
          mkdir upload
          app_tgz="Voxy_${VERSION}_aarch64.app.tar.gz"
          dmg="Voxy_${VERSION}_aarch64.dmg"
          for f in "$app_tgz" "$dmg"; do
            if [ ! -s "artifacts/macos/$f" ]; then
              echo "::error::The macOS build has no $f, so the release stays a draft (install.sh needs the macOS build)."
              exit 1
            fi
            cp "artifacts/macos/$f" upload/
          done
          exe="Voxy_${VERSION}_x64-setup.exe"
          if [ "$WINDOWS_OUTCOME" = "success" ] && [ -s "artifacts/windows/$exe" ]; then
            cp "artifacts/windows/$exe" upload/
          else
            echo "::warning::The Windows installer is missing; publishing v$VERSION without it."
          fi

          archive="upload/$app_tgz"
          tar -tzf "$archive" >"$RUNNER_TEMP/files.txt"
          if ! grep -qE '^(\./)?Voxy\.app/Contents/Info\.plist$' "$RUNNER_TEMP/files.txt"; then
            echo "::error::The .app.tar.gz does not have Voxy.app at its root."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/app"
          tar -xzf "$archive" -C "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/Voxy.app"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          if [ "$id" != "com.dizraid.voice" ]; then
            echo "::error::Voxy.app has bundle identifier $id, but install.sh expects com.dizraid.voice."
            exit 1
          fi
          if ! codesign --verify --strict --deep "$app"; then
            echo "::error::The code signature of Voxy.app does not verify."
            exit 1
          fi
          info=$(codesign -dv "$app" 2>&1)
          printf '%s\n' "$info"
          if ! grep -q '^CodeDirectory .*flags=.*runtime' <<<"$info"; then
            echo "::error::Voxy.app is not signed with the hardened runtime."
            exit 1
          fi
          codesign -d --entitlements - --xml "$app" >"$RUNNER_TEMP/entitlements.plist"
          mic=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true)
          if [ "$mic" != "true" ]; then
            echo "::error::Voxy.app lacks the com.apple.security.device.audio-input entitlement, so it could not record."
            exit 1
          fi
          (cd upload && ls -l && shasum -a 256 -- *)

      # Signed build provenance (Sigstore) for every file: binds it to this
      # workflow, commit and tag. Anyone can check a download with
      # `gh attestation verify <file> -R DIZRAID/voxy --signer-workflow DIZRAID/voxy/.github/workflows/release.yml`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: upload/*

      - name: Upload into the draft and publish
        run: |
          set -euo pipefail
          rel="repos/$GH_REPO/releases/$RELEASE_ID"
          json="$RUNNER_TEMP/release.json"
          gh api "$rel" >"$json"
          tag=$(jq -r .tag_name "$json")
          if [ "$(jq -r .draft "$json")" != "true" ]; then
            echo "::error::Release $tag is not a draft any more."
            exit 1
          fi
          if [ "$tag" != "v$VERSION" ]; then
            echo "::error::Draft $RELEASE_ID is for $tag, not v$VERSION."
            exit 1
          fi

          for path in upload/*; do
            name=${path##*/}
            sha=$(shasum -a 256 "$path" | cut -d' ' -f1)
            # A re-run of this job finds its earlier uploads in the draft.
            for old in $(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' "$json"); do
              echo "Replacing the earlier upload of $name"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$old"
            done
            echo "Uploading $name (sha256:$sha)"
            asset=$(gh api -X POST -H 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$name" \
              --input "$path")
            digest=$(jq -r '.digest // empty' <<<"$asset")
            if [ -z "$digest" ]; then
              # No digest in the answer: hash what the release now serves.
              digest="sha256:$(gh api -H 'Accept: application/octet-stream' \
                "repos/$GH_REPO/releases/assets/$(jq -r .id <<<"$asset")" | shasum -a 256 | cut -d' ' -f1)"
            fi
            if [ "$digest" != "sha256:$sha" ]; then
              echo "::error::$name: the release has $digest, the checked file is sha256:$sha."
              exit 1
            fi
          done

          url=$(gh api -X PATCH "$rel" -F draft=false -F prerelease=false -f make_latest=true --jq .html_url)
          echo "Published $tag: $url"
