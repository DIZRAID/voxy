# Build Voxy on macOS (Apple Silicon) and Windows (x64) and run its unit tests.
# On Windows the unit tests are only compiled for now (see "Unit tests").
#
# Kept cheap on purpose: the repository is private, and GitHub bills macOS
# runner minutes at 10x and Windows at 2x. So: debug profile only (the release
# profile uses full LTO and is much slower), no debug info, a Rust cache, runs
# only when code changes, and a newer push cancels the running one.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "ui/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/fetch-sherpa-onnx.sh"
  pull_request:
    paths:
      - "src-tauri/**"
      - "ui/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/fetch-sherpa-onnx.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No debug info in CI builds: faster compile and link, much smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Windows: link the static C runtime like `cargo tauri dev/build` do. The
  # sherpa-onnx libraries are built with /MT; without this the linker mixes
  # CRTs (LNK4098 on LIBCMT). Ignored on macOS.
  STATIC_VCRUNTIME: "true"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon (arm64). macos-14 is deprecated.
          - name: macOS (arm64)
            os: macos-latest
            timeout: 30
            sherpa_archive: osx-arm64-static-lib
            test_args: ""
          # The Windows port has never been compiled before this job.
          - name: Windows (x64)
            os: windows-latest
            timeout: 45
            sherpa_archive: win-x64-static-MT-Release-lib
            # Build and link the test binary without running it.
            test_args: --no-run
    defaults:
      run:
        working-directory: src-tauri

    # Third-party actions are pinned to full commit SHAs (Dependabot bumps
    # them, see .github/dependabot.yml); a moved tag cannot change what runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-25
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Only main writes the cache; PRs reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Keep compiled dependencies even when our own code fails to build,
          # so the next attempt (e.g. fixing the Windows port) starts warm.
          cache-on-failure: true

      # sherpa-onnx-sys normally downloads its static libraries into
      # target/sherpa-onnx-prebuilt/, without checking any hash. The script
      # downloads them itself, checks the SHA-256 pinned in
      # src-tauri/sherpa-onnx.sha256, and passes them on through
      # SHERPA_ONNX_LIB_DIR, so the build script downloads nothing. That also
      # keeps them outside target/: rust-cache deletes files there before
      # saving but keeps the build-script output that points at them, so the
      # next cached run would fail to link.
      - name: Fetch and verify sherpa-onnx static libraries
        shell: bash
        env:
          SHERPA_ARCHIVE: ${{ matrix.sherpa_archive }}
        run: bash ../.github/scripts/fetch-sherpa-onnx.sh "$SHERPA_ARCHIVE"

      - name: Build (debug)
        run: cargo build --locked

      # Tests marked #[ignore] need the network and are skipped here.
      # On Windows the test binary is only compiled and linked (--no-run).
      # tauri-build embeds the Common Controls v6 manifest in the app binary
      # only, and without it a test binary that imports comctl32 functions
      # through tao/muda/wry dies at load with 0xC0000139 before any test runs
      # (tauri-apps/tauri#13419). Running them on Windows needs build.rs to
      # embed that manifest in test binaries too.
      - name: Unit tests
        run: cargo test --locked --lib ${{ matrix.test_args }}

      - name: Summary
        shell: bash
        env:
          TEST_ARGS: ${{ matrix.test_args }}
        run: |
          bin=target/debug/voxy
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          ls -l "$bin"
          if [ "$TEST_ARGS" = "--no-run" ]; then
            tests="unit tests compiled, not run"
          else
            tests="unit tests passed"
          fi
          {
            echo "### ${{ matrix.name }}"
            echo "Debug build linked (\`src-tauri/$bin\`, $(du -h "$bin" | cut -f1)); $tests."
          } >> "$GITHUB_STEP_SUMMARY"
